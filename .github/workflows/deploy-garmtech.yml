name: Build and deploy AmberHome

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amberhome-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: 2
      PUBLIC_SANITY_PROJECT_ID: kshtq64w
      PUBLIC_SANITY_DATASET: production
      PUBLIC_SITE_URL: https://amberhome.lv

    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static website
        run: npm run build

      - name: Check generated website files
        run: |
          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml

      - name: Upload the finished website to Garmtech
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.GARMTECH_FTP_SERVER }}
          username: ${{ secrets.GARMTECH_FTP_USERNAME }}
          password: ${{ secrets.GARMTECH_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /httpdocs/dist/
          dangerous-clean-slate: false
          log-level: minimal
