name: Build and deploy AmberHome

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: amberhome-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: 2
      PUBLIC_SANITY_PROJECT_ID: kshtq64w
      PUBLIC_SANITY_DATASET: production
      PUBLIC_SITE_URL: https://amberhome.lv

    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check published Sanity content
        id: sanity
        run: node scripts/sanity-fingerprint.mjs

      - name: Look for a completed deployment of this content
        id: deployed-content
        uses: actions/cache/restore@v4
        with:
          path: .deployment-marker
          key: amberhome-${{ github.sha }}-${{ steps.sanity.outputs.fingerprint }}

      - name: Build the static website
        if: github.event_name != 'schedule' || steps.deployed-content.outputs.cache-hit != 'true'
        run: npm run build

      - name: Check generated website files
        if: github.event_name != 'schedule' || steps.deployed-content.outputs.cache-hit != 'true'
        run: |
          test -s dist/index.html
          test -s dist/robots.txt
          test -s dist/sitemap.xml

      - name: Upload the finished website to Garmtech
        if: github.event_name != 'schedule' || steps.deployed-content.outputs.cache-hit != 'true'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.GARMTECH_FTP_SERVER }}
          username: ${{ secrets.GARMTECH_FTP_USERNAME }}
          password: ${{ secrets.GARMTECH_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /httpdocs/dist/
          dangerous-clean-slate: false
          log-level: minimal

      - name: Remember successfully deployed content
        if: steps.deployed-content.outputs.cache-hit != 'true'
        run: touch .deployment-marker

      - name: Save deployed content marker
        if: steps.deployed-content.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deployment-marker
          key: amberhome-${{ github.sha }}-${{ steps.sanity.outputs.fingerprint }}
